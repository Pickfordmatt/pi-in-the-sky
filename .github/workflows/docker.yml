name: Docker image

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', 'deploy/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/co-pi-lot

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: co-pi-lot:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -eu
          CONFIG_B64=$(printf 'setupVersion: 3\nupdate:\n  auto: false\n' | base64 -w0)
          docker run -d --name smoke -p 7878:7878 \
            -e OHMYPI_WEB_TOKEN=smoke-test-token \
            -e OMP_CONFIG_YML_B64="$CONFIG_B64" co-pi-lot:test
          for i in $(seq 1 30); do curl -fsS http://localhost:7878/ >/dev/null 2>&1 && break; sleep 1; done
          echo "--- container log"; docker logs smoke
          echo "--- UI is served";            curl -fsS http://localhost:7878/ | grep -q 'Co-π-lot'
          echo "--- API refuses without token"; test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:7878/api/tasks)" = 401
          echo "--- API works with token";      curl -fsS -H 'Authorization: Bearer smoke-test-token' http://localhost:7878/api/config | tee /dev/stderr | grep -q '"ompVersion":"omp/'
          echo "--- config seeded from env";    docker exec smoke grep -q 'setupVersion: 3' /home/node/.omp/agent/config.yml
          echo "--- workspace is writable";     docker exec smoke sh -c 'touch /workspace/.w && rm /workspace/.w'
          echo "--- omp runs";                  docker exec smoke omp --version
          docker rm -f smoke

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Co-π-lot
            org.opencontainers.image.description=Persistent web front end for oh-my-pi (omp)
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
