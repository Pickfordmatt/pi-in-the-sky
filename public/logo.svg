<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Co-pi-lot">
  <title>Co-π-lot</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b8cf0"/>
      <stop offset="1" stop-color="#0a4c94"/>
    </linearGradient>
    <linearGradient id="crust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#e39a35"/>
    </linearGradient>
    <linearGradient id="dish" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8742a"/>
      <stop offset="1" stop-color="#8f4d17"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9ebff"/>
    </linearGradient>
    <!-- one feathered wing, drawn for the left side and mirrored for the right -->
    <path id="w" d="M16 25.5C11.5 19.5 5 17.8 1.2 20.6c2.6.9 4 2.1 4.6 3.6-2.6.3-3.6 2-3.4 3.6 2.4-.5 4.4-.1 5.6 1-1.8.9-2.3 2.5-1.7 3.8 3.3-.5 6.5-1.6 9.9-3.2z"/>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#sky)"/>
  <!-- speed streaks: it's flying -->
  <g stroke="#fff" stroke-linecap="round" opacity=".55" stroke-width="2">
    <path d="M7 41h7"/><path d="M5 46h5"/><path d="M50 40h7"/><path d="M54 45h5"/>
  </g>
  <!-- cloud below -->
  <g fill="#fff" opacity=".95">
    <circle cx="22" cy="54" r="5.5"/><circle cx="31" cy="51.5" r="7"/><circle cx="41" cy="53.5" r="5.8"/>
    <rect x="17" y="53.5" width="30" height="7" rx="3.5"/>
  </g>
  <!-- wings -->
  <g fill="url(#wing)" stroke="#a9cdf5" stroke-width=".8" stroke-linejoin="round">
    <use href="#w"/>
    <use href="#w" transform="translate(64 0) scale(-1 1)"/>
  </g>
  <!-- the pie -->
  <path d="M14 29h36l-4.2 11.5H18.2z" fill="url(#dish)"/>
  <ellipse cx="32" cy="29" rx="19" ry="7.2" fill="#b8661f"/>
  <ellipse cx="32" cy="28.2" rx="17.6" ry="6.3" fill="url(#crust)"/>
  <g fill="none" stroke="#8a4512" stroke-width="2.6" stroke-linecap="round">
    <path d="M24.8 26.3c3.1-.9 11.3-.9 14.4 0"/>
    <path d="M28.8 26.1v5.2"/>
    <path d="M35.2 26.1c0 2.5.5 4.2 2 5.2"/>
  </g>
  <!-- little shine -->
  <path d="M20 25.5c2-1.6 4.6-2.4 7-2.7" stroke="#fff3cf" stroke-width="1.6" stroke-linecap="round" fill="none" opacity=".8"/>
</svg>
